---
- name: Install psycopg2 for postgresql_user module
  ansible.builtin.dnf:
    name: python3-psycopg2
    state: present

- name: Deploy replication config (postgresql.conf include)
  ansible.builtin.template:
    src: postgresql.conf.j2
    dest: "{{ pg_data_dir }}/conf.d/replication.conf"
  notify: Restart postgresql

- name: Ensure conf.d is included in postgresql.conf
  ansible.builtin.lineinfile:
    path: "{{ pg_data_dir }}/postgresql.conf"
    line: "include_dir = 'conf.d'"
    state: present
  notify: Restart postgresql

- name: Create conf.d directory
  ansible.builtin.file:
    path: "{{ pg_data_dir }}/conf.d"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Deploy pg_hba.conf
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ pg_data_dir }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0600"
  notify: Restart postgresql

- name: Open PostgreSQL port in firewalld
  ansible.posix.firewalld:
    service: postgresql
    permanent: true
    immediate: true
    state: enabled

- name: Create replication role
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ pg_repl_user }}"
    password: "{{ pg_repl_password }}"
    role_attr_flags: REPLICATION,LOGIN
