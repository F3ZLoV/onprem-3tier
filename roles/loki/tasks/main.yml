---
- name: Create loki system user
  ansible.builtin.user:
    name: "{{ loki_user }}"
    system: true
    shell: /sbin/nologin
    create_home: false

- name: Create loki directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ loki_user }}"
    group: "{{ loki_user }}"
    mode: "0755"
  loop:
    - "{{ loki_dir }}"
    - "{{ loki_data_dir }}"
    - "{{ loki_data_dir }}/chunks"
    - "{{ loki_data_dir }}/rules"
    - "{{ loki_data_dir }}/compactor"

- name: Check if loki binary exists
  ansible.builtin.stat:
    path: /usr/local/bin/loki
  register: loki_bin

- name: Install unzip
  ansible.builtin.dnf:
    name: unzip
    state: present
  when: not loki_bin.stat.exists

- name: Download loki archive
  ansible.builtin.get_url:
    url: "https://github.com/grafana/loki/releases/download/v{{ loki_version }}/loki-linux-amd64.zip"
    dest: /tmp/loki.zip
    mode: "0644"
  when: not loki_bin.stat.exists

- name: Extract loki binary
  ansible.builtin.unarchive:
    src: /tmp/loki.zip
    dest: /tmp
    remote_src: true
  when: not loki_bin.stat.exists

- name: Install loki binary
  ansible.builtin.copy:
    src: /tmp/loki-linux-amd64
    dest: /usr/local/bin/loki
    mode: "0755"
    remote_src: true
  when: not loki_bin.stat.exists
  notify: Restart loki

- name: Deploy loki config
  ansible.builtin.template:
    src: loki.yml.j2
    dest: "{{ loki_dir }}/loki.yml"
    owner: "{{ loki_user }}"
    group: "{{ loki_user }}"
    mode: "0644"
  notify: Restart loki

- name: Deploy systemd unit
  ansible.builtin.template:
    src: loki.service.j2
    dest: /etc/systemd/system/loki.service
    mode: "0644"
  notify: Restart loki

- name: Open loki port in firewalld
  ansible.posix.firewalld:
    port: "{{ loki_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled

- name: Enable and start loki
  ansible.builtin.systemd:
    name: loki
    state: started
    enabled: true
    daemon_reload: true
