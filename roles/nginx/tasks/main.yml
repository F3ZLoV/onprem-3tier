---
- name: Install nginx
  ansible.builtin.dnf:
    name: nginx
    state: present

- name: Deploy index page (shows hostname)
  ansible.builtin.template:
    src: index.html.j2
    dest: /usr/share/nginx/html/index.html
  notify: Restart nginx

- name: Open HTTP in firewalld
  ansible.posix.firewalld:
    service: http
    permanent: true
    immediate: true
    state: enabled

- name: Enable and start nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
